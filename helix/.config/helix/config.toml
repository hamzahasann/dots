theme = "mydracula"

[editor]
line-number = "relative"
mouse = true
clipboard-provider = "x-clip"
cursorline = true
continue-comments = false
auto-format = true
color-modes = true

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[editor.statusline]
left = ["mode", "spinner", "diagnostics"]
center = ["file-modification-indicator", "file-name"]
right = ["version-control"]
separator = "|"
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.lsp]
# display-inlay-hints = true


[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]


