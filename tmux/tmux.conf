# tmux config
#
# macOS Command-key shortcuts need help from the terminal emulator.
# tmux documents Ctrl as C-, Shift as S-, Alt/Meta as M-, and custom terminal
# escape sequences as User0, User1, etc. It does not receive Cmd directly.
#
# Map your terminal's Cmd shortcuts to the escape sequences below.

##### Cmd-key user keys #######################################################
# Splits
set -s user-keys[0]  "\e[5;30000~" # Cmd-d
set -s user-keys[1]  "\e[5;30001~" # Cmd-Shift-d

# Focus movement
set -s user-keys[2]  "\e[5;30002~" # Cmd-h
set -s user-keys[3]  "\e[5;30003~" # Cmd-j
set -s user-keys[4]  "\e[5;30004~" # Cmd-k
set -s user-keys[5]  "\e[5;30005~" # Cmd-l

# Pane movement
set -s user-keys[6]  "\e[5;30006~" # Cmd-Shift-h
set -s user-keys[7]  "\e[5;30007~" # Cmd-Shift-j
set -s user-keys[8]  "\e[5;30008~" # Cmd-Shift-k
set -s user-keys[9]  "\e[5;30009~" # Cmd-Shift-l

# Copy mode toggle
set -s user-keys[10] "\e[5;30010~" # Cmd-s

# Scrollback editor
set -s user-keys[23] "\e[5;30023~" # Cmd-e

# Pane/window/session commands
set -s user-keys[11] "\e[5;30011~" # Cmd-x
set -s user-keys[12] "\e[5;30012~" # Cmd-t
set -s user-keys[13] "\e[5;30013~" # Cmd-n

# Tab selection
set -s user-keys[14] "\e[5;30014~" # Cmd-1
set -s user-keys[15] "\e[5;30015~" # Cmd-2
set -s user-keys[16] "\e[5;30016~" # Cmd-3
set -s user-keys[17] "\e[5;30017~" # Cmd-4
set -s user-keys[18] "\e[5;30018~" # Cmd-5
set -s user-keys[19] "\e[5;30019~" # Cmd-6
set -s user-keys[20] "\e[5;30020~" # Cmd-7
set -s user-keys[21] "\e[5;30021~" # Cmd-8
set -s user-keys[22] "\e[5;30022~" # Cmd-9

##### General ################################################################
set-option -g mouse on

# True color and extended modified-key support for Ghostty.
set-option -g default-terminal "tmux-256color"
set-option -g terminal-features "xterm-ghostty:RGB,extkeys,clipboard,focus,title"
set-option -s extended-keys always
set-option -s extended-keys-format csi-u

##### Window/tab/pane numbering ##############################################
# Start tmux windows/tabs and panes at 1. Keep window numbers compact after closing tabs.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

##### Status line #############################################################
# Gruvbox Dark Hard palette.
# dark0_hard=#1d2021 dark0=#282828 dark1=#3c3836 dark2=#504945
# fg=#ebdbb2 gray=#928374 yellow=#fabd2f orange=#fe8019 aqua=#8ec07c red=#fb4934
set-option -g status on
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style "bg=#1d2021,fg=#ebdbb2"

# Left: prefix indicator + session name.
set-option -g status-left-length 80
set-option -g status-left "#{?client_prefix,#[fg=#1d2021,bg=#fe8019,bold] PREFIX #[fg=#fe8019,bg=#1d2021,nobold] ,}#[fg=#1d2021,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#1d2021,nobold] "
set-option -g status-left-style "bg=#1d2021,fg=#ebdbb2"

# Right: hostname only.
set-option -g status-right-length 80
set-option -g status-right "#[fg=#3c3836,bg=#1d2021]#[fg=#ebdbb2,bg=#3c3836] #{host_short} "
set-option -g status-right-style "bg=#1d2021,fg=#ebdbb2"

# Center: windows/tabs.
set-window-option -g window-status-separator ""
set-window-option -g window-status-style "bg=#1d2021,fg=#928374"
set-window-option -g window-status-format "#[fg=#928374,bg=#1d2021] #I:#W "
set-window-option -g window-status-current-style "bg=#8ec07c,fg=#1d2021,bold"
set-window-option -g window-status-current-format "#[fg=#1d2021,bg=#8ec07c,bold] #I:#W #[fg=#8ec07c,bg=#1d2021,nobold]"
set-window-option -g window-status-activity-style "bg=#1d2021,fg=#fabd2f"
set-window-option -g window-status-bell-style "bg=#fb4934,fg=#1d2021,bold"

# Match tmux prompts, copy-mode selection, and pane borders to the same palette.
set-option -g message-style "bg=#fabd2f,fg=#1d2021,bold"
set-window-option -g mode-style "bg=#504945,fg=#fabd2f,bold"
set-window-option -g pane-border-style "#{?pane_in_mode,fg=#fe8019,fg=#504945}"
set-window-option -g pane-active-border-style "#{?pane_in_mode,fg=#fe8019,fg=#fabd2f}"
set-window-option -g pane-border-status off
# Do not use tmux's arrow/half-border active-pane indicators.
set-window-option -g pane-border-indicators off
set-hook -g pane-mode-changed 'set -g pane-active-border-style "#{?pane_in_mode,fg=#fe8019,fg=#fabd2f}"'

##### Pane splits #############################################################
# Cmd-d: split right. Cmd-Shift-d: split bottom.
bind-key -n User0 split-window -h -c "#{pane_current_path}"
bind-key -n User1 split-window -v -c "#{pane_current_path}"

##### Pane focus ##############################################################
# Cmd-h/j/k/l: move focus left/down/up/right.
bind-key -n User2 select-pane -L
bind-key -n User3 select-pane -D
bind-key -n User4 select-pane -U
bind-key -n User5 select-pane -R

##### Pane movement ###########################################################
# Cmd-Shift-h/j/k/l: move the current pane left/down/up/right.
bind-key -n User6 swap-pane -t "{left-of}"  \; select-pane -t "{left-of}"
bind-key -n User7 swap-pane -t "{down-of}"  \; select-pane -t "{down-of}"
bind-key -n User8 swap-pane -t "{up-of}"    \; select-pane -t "{up-of}"
bind-key -n User9 swap-pane -t "{right-of}" \; select-pane -t "{right-of}"

##### Pane/window/session commands ###########################################
# Cmd-e: open current pane scrollback in Helix.
# Cmd-x: close pane. Cmd-t: new tmux window/tab. Cmd-n: new tmux session.
bind-key -n User23 run-shell 'f=$(mktemp /tmp/tmux-scrollback.XXXXXX); tmux capture-pane -t "#{pane_id}" -p -S - -E - > "$f"; line=$(wc -l < "$f" | tr -d " "); tmux new-window -c "#{pane_current_path}" "hx +$line \"$f\""'
bind-key -n User11 kill-pane
bind-key -n User12 new-window -c "#{pane_current_path}"
bind-key -n User13 new-session -c "#{pane_current_path}"

# Cmd-1..9: switch to tmux window/tab 1..9.
bind-key -n User14 select-window -t :1
bind-key -n User15 select-window -t :2
bind-key -n User16 select-window -t :3
bind-key -n User17 select-window -t :4
bind-key -n User18 select-window -t :5
bind-key -n User19 select-window -t :6
bind-key -n User20 select-window -t :7
bind-key -n User21 select-window -t :8
bind-key -n User22 select-window -t :9

# Ctrl-b s: session tree, expanded, showing only window/tab 1 and its panes.
# In this tree: x kills the selected session/window/pane; t tags; X kills tags.
bind-key s choose-tree -Z -f "#{||:#{session_format},#{&&:#{==:#{window_index},1},#{||:#{window_format},#{pane_format}}}}"
bind-key w display-popup -E "$HOME/.config/tmux/scripts/tmux-session-popup.sh"

##### Copy mode ###############################################################
# Use vi keys in copy mode: h/j/k/l move, v selects, y copies to macOS clipboard.
set-window-option -g mode-keys vi
bind-key -n User10 copy-mode
bind-key -n C-s    copy-mode
bind-key -T copy-mode-vi User10 send-keys -X cancel
bind-key -T copy-mode-vi C-s    send-keys -X cancel
bind-key -T copy-mode-vi v      send-keys -X begin-selection
# Helix-style x: select current line; repeated x extends line selection downward.
bind-key -T copy-mode-vi x      if -F "#{selection_present}" "send-keys -X selection-mode line \; send-keys -X cursor-down" "send-keys -X select-line"
bind-key -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel "pbcopy"
